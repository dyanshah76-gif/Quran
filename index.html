<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <title>Lecture du Coran</title>
    <meta name="description" content="Lire le Coran sourate par sourate : texte arabe uthmani, traduction de Muhammad Hamidullah, explication de chaque verset (al-Mukhtasar) et hadiths authentiques qui le citent.">
    <meta name="theme-color" content="#f6f7f3">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="preload" href="https://cdn.jsdelivr.net/gh/fawazahmed0/quran-api@93e6f64925ae76273520d636fcaaf061129f2316/fonts/uthmanic-hafs-ver13.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="assets/styles.css">
    <script>
      // Apply saved theme, text sizes and language before the first paint.
      (function () {
        try {
          var s = JSON.parse(localStorage.getItem('quran.settings.v1') || 'null');
          if (!s) return;
          var r = document.documentElement;
          if (s.theme === 'light' || s.theme === 'dark') r.setAttribute('data-theme', s.theme);
          if (typeof s.arSize === 'number') r.style.setProperty('--ar-size', s.arSize + 'px');
          if (typeof s.trSize === 'number') r.style.setProperty('--tr-size', s.trSize + 'px');
          if (s.ui === 'fr' || s.ui === 'en' || s.ui === 'ar') r.lang = s.ui;
          if (s.ui === 'rur') r.lang = 'ur-Latn';
          if (s.ui === 'ar') r.dir = 'rtl';
        } catch (e) {}
      })();
    </script>
    <script type="module" src="assets/app.js"></script>
  </head>
  <body>
    <a class="skip-link" id="skip-link" href="#">Aller au contenu</a>
    <header class="topbar" id="topbar"></header>

    <main id="main" class="wrap" tabindex="-1">
      <noscript>
        <p class="notice">Ce site a besoin de JavaScript pour charger le texte du Coran. This site needs JavaScript to load the Quran text.</p>
      </noscript>
    </main>

    <footer class="site-footer" id="site-footer"></footer>

    <div class="backdrop" id="backdrop" hidden></div>
    <section class="sheet" id="tafsir" role="dialog" aria-modal="true" aria-labelledby="tafsir-title" hidden></section>
    <dialog class="settings" id="settings" aria-labelledby="settings-title"></dialog>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </body>
</html>
